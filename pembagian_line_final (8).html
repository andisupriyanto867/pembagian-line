<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembagian Line</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#1b2430; --mute:#6b7685; --line:#d9dfe8;
    --brand:#0b5ed7; --cyan:#00e5ff; --yellow:#ffff00;
    --l1:#fff2cc; --l2:#b6d7a8; --l3:#c9daf8; --l4:#ead1dc; --l5:#fce5cd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0 4px 0 0;display:flex;align-items:center;gap:8px}
  .logo{width:24mm;height:6mm;object-fit:contain;display:block}
  .clock{display:flex;flex-direction:column;line-height:1.15;font-size:11.5px;color:var(--mute);margin-right:10px;white-space:nowrap}
  .clock b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .ctl{display:flex;align-items:center;gap:6px;font-size:13px}
  select,input[type=text],textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;background:#fff}
  button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
  button:hover{background:#eef3ff}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{background:#0a4fb5}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 14px}
  .seg button.on{background:var(--brand);color:#fff}
  main{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:14px;padding:14px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h2{margin:0;padding:10px 12px;font-size:14px;background:#f8fafd;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

  /* ringkasan (gambar 1) */
  .sum{display:grid;grid-template-columns:1fr 70px 90px;background:var(--yellow);font-weight:700;text-align:center;border-bottom:1px solid #000}
  .sum div{padding:8px;border-left:1px solid #000}
  .sum div:first-child{border-left:0;background:#6d9eeb;color:#000}
  .filters{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .filters input[type=text]{flex:1;min-width:120px}
  .lh{display:grid;grid-template-columns:34px 1fr 56px 78px;padding:6px 10px;font-size:12px;font-weight:700;text-align:center;border-bottom:1px solid #000;background:#fff}
  .lh div:nth-child(2){text-align:left}
  .dclist{max-height:calc(100vh - 290px);overflow:auto}
  .dc{display:grid;grid-template-columns:34px 1fr 56px 78px;align-items:center;padding:7px 10px;border-bottom:1px solid #eef1f6;cursor:pointer;font-weight:600;font-size:13px}
  .dc:hover{background:#f4f8ff}
  .dc .n{text-align:center;font-weight:700}
  .dc .name small{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;color:#222}
  .dc input{width:17px;height:17px;cursor:pointer}
  .dc .num{text-align:center}
  .dc.taken{background:#fafbfd}

  /* papan pembagian (2D rata) */
  .board{background:#000;border:1px solid #000;overflow-x:auto}
  .bh,.ln{display:grid;grid-template-columns:170px minmax(260px,1fr) 70px 96px minmax(150px,.7fr);gap:1px;background:#000;min-width:780px;margin-bottom:2px}
  .bh:last-child,.ln:last-child{margin-bottom:0}
  .bh{font-weight:700;text-align:center}
  .bh>div{background:var(--cyan);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;line-height:1.1}
  .bh .t{grid-column:span 2;font-size:15px}
  .bh .h b{font-size:17px}
  .bh .h small{font-size:10.5px;font-weight:700;color:#0a5566;margin-top:2px}
  .ln{position:relative;cursor:pointer}
  .ln.active{outline:3px solid var(--brand);outline-offset:-3px;z-index:1}
  .ln>div{background:var(--c);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:6px;min-height:42px}
  .ln .lbl{grid-column:1;flex-direction:column;gap:3px;font-size:15px}
  .ln .lbl small{font-size:11px;font-weight:600;color:#333}
  .ln .lbl .tag{font-size:11px;font-weight:700;color:#1f4fb3}
  .ln .lbl .tag.ok{color:#fff;background:#1f9d55;border-radius:3px;padding:1px 7px}
  .ln .dt{grid-column:2;gap:8px;font-size:12.5px;cursor:pointer}
  .ln .dt:hover{text-decoration:underline}
  .ln .dt b.x{cursor:pointer;color:#b00020;font-size:15px;line-height:1}
  .ln .dt i{font-style:normal}
  .ln .num{font-size:16px}
  .ln .c3{grid-column:3}.ln .c4{grid-column:4}.ln .c5{grid-column:5}
  .ln .chk{background:#fff}
  .ln .chk input{width:20px;height:20px;cursor:pointer;accent-color:#1e9e50}
  .ln .note{grid-column:5;background:#fff;padding:4px}
  .ln .note textarea{width:100%;height:100%;min-height:58px;border:0;resize:none;font-weight:400;padding:4px;background:#fff}
  .ln .empty{grid-column:2/span 4;color:#6f7682;font-weight:400;font-style:italic;background:var(--c)}
  /* DC sudah selesai: DC, WO, PCS diblok hijau */
  .ln>div.fin{background:#1f9d55;color:#fff}
  .ln .fin b.x{color:#ffd9d9}
  .ln .dt.fin::before{content:"✔ "}

  /* baris total per Line (kuning) */
  .ln>div.tot{background:var(--yellow);font-weight:800;color:#000}
  .ln .tl{grid-column:2;font-size:13px;letter-spacing:.3px}
  .ln .tot.num{font-size:16px}
  /* kartu statistik per Line */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-10px -12px 8px;padding:8px 12px;border-bottom:2px solid #0006;border-radius:10px 10px 0 0;font-size:17px;font-weight:800;color:#111}
  .lhead small{font-size:11.5px;font-weight:600;color:#333;display:inline}
  .dcp{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .dcp .dh{font-size:11.5px;font-weight:800;color:#333;margin-bottom:4px}
  .dcp .dci{padding:6px 0;border-bottom:1px solid #eef1f6}
  .dcp .dci:last-child{border-bottom:0}
  .dcp .t{font-size:12px;font-weight:700;line-height:1.25;margin-bottom:3px}
  .dcbox{display:inline-block;background:#ffeb3b;color:#000;border:1px solid #000;border-radius:4px;padding:2px 8px;font-weight:700;line-height:1.25}
  .dcp .pl{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .dcp .pl span{width:30px;color:#4b5565}
  .dcp .pl b{flex:1;font-size:12.5px}
  .dcp .pl em{font-style:normal;font-size:11.5px;color:#1c4f9e}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat small{color:var(--mute);display:block}
  .stat b{font-size:18px}
  .bar{height:10px;background:#dfe5ee;border-radius:6px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%}
  .hint{color:var(--mute);font-size:12px;padding:8px 12px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
  #toast.show{opacity:1}
  #loader{position:fixed;inset:0;background:rgba(255,255,255,.8);backdrop-filter:blur(2px);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-weight:700;z-index:30;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  #loader.show{opacity:1;visibility:visible}
  .spin{width:44px;height:44px;border:4px solid #d9e4fb;border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .skel{height:16px;margin:14px 10px;border-radius:6px;background:linear-gradient(90deg,#eceff5 25%,#f8fafd 50%,#eceff5 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
  .skel.t{height:46px}
  @keyframes shim{to{background-position:-200% 0}}
  .fadein{animation:fin .35s ease both}
  @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* rekap keterangan per DC */
  #rekap{display:none;padding:14px;overflow-x:auto}
  body.v-rekap #rekap{display:block}
  body.v-rekap main,body.v-rekap #btnAuto,body.v-rekap #btnMulti,body.v-rekap #btnClear,body.v-rekap #btnExport,body.v-rekap #btnSave,body.v-rekap #lineCtl{display:none}
  .rk-wrap{min-width:980px;max-width:1300px;background:#fff;border:2px solid #000}
  .rk-top,.rk-h,.rk-r{display:grid;grid-template-columns:minmax(230px,2fr) 92px 112px minmax(210px,1.6fr) minmax(250px,1.7fr);align-items:stretch}
  .rk-top{padding:10px 0 8px;gap:4px;font-weight:700;text-align:center}
  .rk-top>div{display:flex;align-items:center;justify-content:center}
  .rk-shift{font-size:18px}
  .rk-y{background:var(--yellow);border:2px solid #000;font-size:18px;padding:6px 0}
  .rk-h,.rk-r{gap:1px;background:#000}
  .rk-h{border-top:2px solid #000;border-bottom:2px solid #000}
  .rk-h>div{background:#a4c2f4;display:flex;align-items:center;justify-content:center;padding:7px 4px;font-size:12px;font-weight:700;text-align:center}
  .rk-r{border-bottom:1px solid #000;cursor:pointer;font-weight:700;font-size:13px}
  .rk-r>div{background:#fff;padding:6px 10px;display:flex;align-items:center;min-height:40px}
  .rk-r:hover>.d,.rk-r:hover>.c{background:#eaf2ff}
  .rk-r .d{justify-content:flex-start}
  .rk-r .c{justify-content:center;text-align:center}
  .rk-r .k{justify-content:flex-start;color:#8a929e;font-weight:500}
  .rk-r .k.has{background:hsl(var(--kh) 85% 80%);color:hsl(var(--kh) 80% 12%);font-weight:700}
  .rk-r .pg{flex-direction:column;align-items:stretch;justify-content:center;gap:2px;font-weight:600}
  .pg .pl{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .pg .pl span{width:30px;color:#4b5565}
  .pg .pl b{flex:1;font-size:12.5px}
  .pg .pl em{font-style:normal;font-size:11.5px;color:#1c4f9e}
  .b3{height:9px;background:#dfe5ee;border:1px solid #9aa5b5;margin-bottom:3px}
  .b3 i{display:block;height:100%;background:#2b7be8}
  .b3.g i{background:#2fb465}
  .b3.full i{background:#f5bd0a}
  /* rekap keterangan: pilihan tampilan + tampilan Per DC */
  .rk-view{display:inline-flex;gap:0;margin:0 0 12px;border:1.5px solid #8fa6cf;border-radius:10px;overflow:hidden;background:#fff;position:sticky;left:0}
  .rk-view button{border:0;border-radius:0;background:#fff;padding:9px 16px;font-weight:700;font-size:13.5px;min-height:40px}
  .rk-view button.on{background:#1558d6;color:#fff}
  .rc-wrap{max-width:1180px;background:#fbfbf9;border:1px solid #e1e5ec;border-radius:16px;padding:20px 18px 14px;color:#1b2430}
  .rc-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px}
  .rc-top span{display:block;font-size:14px;color:#5b6678}.rc-top b{display:block;font-size:34px;line-height:1.15;font-weight:800;margin-top:2px}
  .rc-bar{height:9px;border-radius:99px;background:#e5e8ee;overflow:hidden;flex:1;min-width:40px}.rc-bar i{display:block;height:100%;border-radius:99px}
  .rc-bar.big{margin-top:8px;height:10px}
  .rc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .rc-chips button{border-radius:999px;padding:8px 16px;background:#fff;border:1.5px solid #c9d1de;font-size:14px;font-weight:600;color:#3a4558;min-height:38px}
  .rc-chips button.on{background:#cfe3fb;border-color:#6aa5ec;color:#0f4c9c}
  .rc-colh,.rc-hd,.rc-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 150px 230px;column-gap:12px;align-items:center}
  .rc-colh{padding:0 18px 6px;font-size:13px;color:#5b6678}.rc-colh span:nth-child(2),.rc-colh span:nth-child(3){text-align:right}
  .rc-dc{background:#fff;border:2.5px solid #1b2430;border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:0 3px 10px rgba(27,36,48,.18)}
  .rc-hd{padding:12px 18px;background:hsl(var(--dh,52) 88% 72%);border-bottom:2.5px solid #1b2430;border-left:7px solid hsl(var(--dh,52) 70% 38%);cursor:pointer}
  .rc-hd .n small{color:hsl(var(--dh,52) 70% 18%)!important}.rc-hd .rc-bar{background:#fff;box-shadow:inset 0 0 0 1px rgba(27,36,48,.35)}
  .rc-hd .n b{display:block;font-size:17px;font-weight:800}.rc-hd .n small{font-size:13.5px;color:#5b6678}
  .rc-hd .w,.rc-hd .p{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .rc-row{padding:13px 18px;border-top:1.5px solid #7f8ca3;cursor:pointer;font-size:16px}
  .rc-hd + .rc-row{border-top:0}
  .rc-row:nth-of-type(even){background:#fafbfd}
  .rc-row:first-of-type{border-top:0}
  .rc-hd:hover{background:hsl(var(--dh,52) 90% 66%)}.rc-row:hover{background:#eef4ff}
  .rc-row .w,.rc-row .p{text-align:right;font-variant-numeric:tabular-nums}
  .rc-hd .g,.rc-row .g{display:flex;align-items:center;gap:12px}
  .rc-hd .g em,.rc-row .g em{font-style:normal;width:44px;text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
  .rc-row .k{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
  .rc-pill{background:hsl(var(--h) 85% 87%);color:hsl(var(--h) 75% 22%);border-radius:99px;padding:6px 15px;font-weight:700;font-size:15px}
  .rc-note{border:1.5px solid #cfd5df;border-radius:99px;padding:5px 14px;font-size:15px;color:#3a4558;background:#fcfcfb}
  .rc-none{color:#7c8594;font-size:17px}
  .rc-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px;color:#4a5566}.rc-leg i{display:inline-block;width:14px;height:10px;margin-right:6px;border-radius:2px}
  @media(max-width:760px){
    .rc-wrap{padding:14px 10px 10px;border-radius:12px}.rc-top{grid-template-columns:1fr 1fr;gap:10px}.rc-top b{font-size:26px}.rc-top>div:last-child{grid-column:1/-1}
    .rc-colh{display:none}
    .rc-hd,.rc-row{grid-template-columns:auto minmax(0,1fr) 1fr;row-gap:6px;padding:11px 12px}
    .rc-hd .n,.rc-row .k{grid-column:1/-1}.rc-hd .w,.rc-hd .p,.rc-row .w,.rc-row .p{text-align:left}
    .rc-hd .w::before,.rc-row .w::before{content:"WO ";color:#7c8594;font-size:12px;font-weight:600}.rc-hd .p::before,.rc-row .p::before{content:"PCS ";color:#7c8594;font-size:12px;font-weight:600}
    .rc-hd .w,.rc-row .w{grid-column:1}.rc-hd .p,.rc-row .p{grid-column:2}.rc-hd .g,.rc-row .g{grid-column:3}
    .rc-row{font-size:14.5px}.rc-pill,.rc-note{font-size:13.5px;padding:4px 11px}
  }
  /* menu pencarian */
  #cari{display:none;padding:14px}
  body.v-cari #cari{display:block}
  body.v-cari main,body.v-cari #btnAuto,body.v-cari #btnMulti,body.v-cari #btnClear,body.v-cari #btnExport,body.v-cari #btnSave,body.v-cari #lineCtl{display:none}
  .cr-bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:6px}
  .cc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0001}
  .cc.ok{border-left:6px solid #1f8f4a}.cc.no{border-left:6px solid #c62828}
  .cc-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:9px 10px;background:#f8fafd;border-bottom:1px solid var(--line)}
  .cc-top{padding:9px 10px;display:grid;gap:8px;border-bottom:1px dashed var(--line);background:#fcfdff}
  .cc-top .fld.opr{position:relative}
  .cc .otime{position:absolute;right:0;bottom:-2px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;padding:4px 11px 5px;border-radius:10px;background:linear-gradient(180deg,#2fb465,#13803f);border:1px solid #0d6a33;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #0a5428,0 4px 8px rgba(10,84,40,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .cc .otime small{font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#d6f5e1}
  .cc .otime b{font-size:17px;font-weight:800;letter-spacing:.6px;font-variant-numeric:tabular-nums;font-family:Consolas,'Segoe UI',monospace;margin-top:1px}
  .cc-g{padding:9px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .fld.wide{grid-column:1/-1}
  .cf.opr{background:#ede7fe;border-color:#7e57c2;color:#311b92;font-weight:800;border-radius:999px;padding:3px 12px;font-size:14px}
  .cc-top .cf.ket{display:block;width:100%;font-size:14px}
  .cf-l{font-size:10.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
  .cf-v{display:flex;flex-wrap:wrap;gap:4px}
  .cf{display:inline-block;padding:3px 8px;border-radius:6px;background:#eef2f9;border:1px solid #d5ddec;cursor:copy;font-weight:600;font-size:13px;word-break:break-word}
  .cf:hover{outline:2px solid var(--brand)}
  .cf.dcn{background:#ffeb3b;border-color:#000;color:#000;font-weight:800}
  .cf.ket.has{background:hsl(var(--kh) 85% 82%);border-color:hsl(var(--kh) 60% 55%);color:hsl(var(--kh) 85% 20%);font-weight:800}
  .cf.nil{background:none;border-color:transparent;color:#8a929e;cursor:default}
  .cf.nil:hover{outline:0}
  .cf.copied{background:#ffe08a!important;color:#000!important}
  .cc mark{background:#ffd54f;color:#000;border-radius:2px;padding:0 1px}
  /* kartu pencarian: bagian terstruktur (Dokumen / Lokasi & Jumlah / Barang / Lainnya) */
  .cc-sec{padding:8px 10px 6px;border-top:1px dashed var(--line)}
  .cc-st{font-size:10.5px;font-weight:800;color:#3b5fa8;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cc-st::after{content:"";flex:1;height:1px;background:#d3deef}
  .cc-sg{display:grid;gap:7px 8px}
  .cc-sg.c3{grid-template-columns:1fr 1.25fr 1fr}
  .cc-sg.cl{grid-template-columns:1.35fr 1fr 1fr}
  .cc-sg.c2{grid-template-columns:1fr 1fr}
  .cc-sg .fld{min-width:0}
  .cc-sg .fld.span{grid-column:1/-1}
  .cc-sg .cf-v .cf{max-width:100%}
  .cc .cf.cf.binf:not(.nil){background-color:#1558d6;background-image:linear-gradient(180deg,#3b86ff,#1558d6);border-color:#0e44ad;color:#fff;font-weight:800;font-size:15.5px;letter-spacing:.3px;white-space:nowrap;text-align:center;display:block;width:100%}
  .cc .cf.cf.qtyc:not(.nil){background-color:#fff3e0;border-color:#f0b35a;color:#8a4b00;font-weight:800;font-size:16px;text-align:center;display:block;width:100%}
  .cc .cf.cf.palc:not(.nil){background-color:#f3e9ff;border-color:#c3a3ee;color:#4b2a8a;font-weight:700;text-align:center;display:block;width:100%}
  .cc .cf.cf.trc:not(.nil){background-color:#e3f6ea;border-color:#79c795;color:#146c3a;font-weight:800;text-align:center;display:block;width:100%}
  .cc .cf.cf.fac:not(.nil){background-color:#fde8e8;border-color:#e59a9a;color:#a11d1d;font-weight:800;text-align:center;display:block;width:100%}
  .cc .cf.binf mark{color:#000}
  /* kartu pencarian 3D */
  .cr-grid{gap:18px;padding:4px 6px 8px 2px}
  .cc{background:linear-gradient(155deg,#ffffff 0%,#eef3fb 100%);border-color:#aebbd4;border-radius:14px;margin:0 4px 4px 0;
    box-shadow:inset 0 1px 0 #fff,1px 1px 0 #c3cde1,2px 2px 0 #b6c2da,3px 3px 0 #a9b7d2,4px 4px 0 #9cabc8,7px 12px 20px rgba(20,35,70,.30);
    transition:transform .2s ease,box-shadow .2s ease}
  .cc:hover{transform:translateY(-3px);
    box-shadow:inset 0 1px 0 #fff,1px 1px 0 #c3cde1,2px 2px 0 #b6c2da,3px 3px 0 #a9b7d2,4px 4px 0 #9cabc8,5px 5px 0 #8fa0bf,10px 18px 26px rgba(20,35,70,.36)}
  .cc-h{background:linear-gradient(180deg,#ffffff,#dfe7f6);box-shadow:0 2px 3px rgba(20,35,70,.15)}
  .cc-top{background:linear-gradient(180deg,#f7f9fe,#edf1fa);box-shadow:inset 0 2px 4px rgba(20,35,70,.08)}
  .cc .cf.cf:not(.nil){background-image:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 55%,rgba(0,0,0,.06));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 0 rgba(0,0,0,.28),0 4px 6px rgba(0,0,0,.16);transition:transform .1s,box-shadow .1s}
  .cc .cf.cf:not(.nil):active{transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 0 0 rgba(0,0,0,0)}
  .cc .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.3),0 3px 5px rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .cc.ok{box-shadow:inset 0 1px 0 #fff,1px 1px 0 #b9d9c5,2px 2px 0 #a3cdb4,3px 3px 0 #8dc1a3,4px 4px 0 #77b592,7px 12px 20px rgba(20,60,35,.30)}
  .cc.no{box-shadow:inset 0 1px 0 #fff,1px 1px 0 #e0c3c3,2px 2px 0 #d6aeae,3px 3px 0 #cc9999,4px 4px 0 #c28484,7px 12px 20px rgba(80,20,20,.28)}
  .rk-note{color:var(--mute);font-size:12px;padding:8px 4px}
  /* progres per Line */
  .ln .lbl .lp{width:100%;height:8px;background:#fff;border:1px solid #000;margin-top:2px}
  .ln .lbl .lp i{display:block;height:100%;background:#1f9d55}
  .lprog{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .lprog .pl{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .lprog .pl span{width:30px;color:#4b5565}
  .lprog .pl b{flex:1;font-size:12.5px}
  .lprog .pl em{font-style:normal;font-size:11.5px;color:#1c4f9e}
  .lprog .eta{font-size:11.5px;color:#444;margin-top:2px;line-height:1.3}
  .lprog .eta.ok{color:#1f8f4a;font-weight:700}

  /* jendela data asli spreadsheet */
  #dlg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
  #dlg.show{display:flex}
  .dlg-box{background:#fff;border-radius:14px;width:min(1180px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .dlg-h{padding:12px 16px;background:linear-gradient(180deg,#f3f7ff,#dfe8f8);border-bottom:1px solid #b9c7e0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .dlg-h h3{margin:0;font-size:15px;flex:1 1 280px}
  .dlg-h h3 small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
  .dlg-h .seg button{padding:6px 12px}
  .dlg-h .seg button.on.ok{background:#1f8f4a;border-color:#1f8f4a}
  .dlg-h .seg button.on.no{background:#c62828;border-color:#c62828}
  .binp{padding:9px 16px;background:#fff8e1;border-bottom:1px solid #f0d98a;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .binp .chip{background:#ffe08a;border:1px solid #d9b23a;border-radius:4px;padding:2px 8px;font-weight:700}
  .binp .chip em{font-style:normal;font-weight:500;color:#555;font-size:11.5px}
  .binp .dobox{width:100%;font:12.5px/1.4 Consolas,monospace;border:1px solid #d9b23a;border-radius:4px;padding:6px;background:#fff;resize:vertical}
  .dlg-b{overflow:auto}
  .dlg-b table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  .dlg-b th{position:sticky;top:0;background:linear-gradient(180deg,#bcd2f7,#9dbbee);padding:8px 10px;text-align:left;font-size:12px;border-bottom:2px solid #6f93d1;white-space:nowrap}
  .dlg-b td{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.12);white-space:nowrap}
  .dlg-b tbody td:not(:first-child){cursor:copy}
  .dlg-b tbody td:not(:first-child):hover{outline:2px solid var(--brand);outline-offset:-2px}
  .dlg-b td.copied{background:#ffe08a!important;color:#000!important}
  .dlg-b th[data-ccol],.dlg-b th[data-copy]{background:linear-gradient(180deg,#d4e3fb,#b3cdf5)}
  .dlg-b tr.ok td{background:#c9f2d3;color:#0b4a1f}
  .dlg-b tr.no td{background:#ffd2d2;color:#7a0b0b}
  .dlg-b tr.ok td:first-child{box-shadow:inset 5px 0 0 #1f8f4a}
  .dlg-b tr.no td:first-child{box-shadow:inset 5px 0 0 #c62828}
  .pill{display:inline-block;padding:1px 9px;border-radius:10px;font-weight:700;font-size:11.5px;color:#fff}
  .pill.ok{background:#1f8f4a}.pill.no{background:#c62828}
  .dlg-f{padding:8px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  /* === Jendela detail DC: diperbesar menyesuaikan layar laptop === */
  #dlg{padding:1.5vh 1.2vw}
  .dlg-box{width:97vw;max-width:2000px;height:95vh;max-height:95vh;border-radius:16px}
  .dlg-h{padding:16px 22px;gap:12px}
  .dlg-h h3{font-size:clamp(20px,1.7vw,28px);flex:1 1 360px}
  .dlg-h h3 small{font-size:clamp(14px,1.05vw,17px);margin-top:4px}
  .dlg-h button,.dlg-h .ctl{font-size:clamp(14px,1.1vw,18px)}
  .dlg-h button{padding:10px 18px}
  .dlg-h .seg button{padding:10px 18px}
  .dlg-h .ctl input{width:20px;height:20px}
  .binp{padding:12px 22px;font-size:clamp(14px,1.1vw,18px);gap:10px}
  .binp .chip{padding:4px 12px;font-size:clamp(14px,1.1vw,18px)}
  .binp .chip em{font-size:clamp(12.5px,.95vw,15px)}
  .binp .dobox{font:clamp(14px,1.1vw,18px)/1.5 Consolas,monospace;padding:10px;min-height:110px}
  .dlg-b{flex:1 1 auto;min-height:0}
  .dlg-b{overflow-x:hidden;overflow-y:auto}
  .dlg-b table{font-size:var(--dfs,15px)}
  .dlg-b th{font-size:var(--dfs,15px);padding:9px 7px}
  .dlg-b td{padding:7px 7px}
  .pill{font-size:clamp(13px,.95vw,15px);padding:2px 12px}
  .dlg-f{padding:12px 22px;font-size:clamp(13px,1vw,16px);gap:20px}
  /* === Tabel pembagian gabungan: DC bertumpuk, total WO/PCS digabung per Line === */
  .ln>div{padding:6px}
  .ln .lbl{font-size:15px;gap:3px;flex-direction:column}
  .ln .lbl .ln-t{font-size:16px}
  .ln .lbl .eta{font-size:11px;font-weight:500;color:#444;line-height:1.25}
  .ln .lbl .eta.ok{color:#1f8f4a;font-weight:800}
  .ln>div.dcs{display:flex;flex-direction:column;gap:1px;background:#000;padding:0;align-items:stretch;justify-content:flex-start}
  .ln .dc{flex:1 1 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--c);font-weight:700;font-size:13px;text-align:left;min-height:44px}
  .ln .dc.fin{background:#1f9d55;color:#fff}
  .ln .dc input{width:18px;height:18px;cursor:pointer;accent-color:#fff;flex:none}
  .ln .dc:not(.fin) input{accent-color:#1e9e50}
  .ln .dc .n{flex:1;line-height:1.2;cursor:pointer}
  .ln .dc .n:hover{text-decoration:underline}
  .ln .dc.fin .n::after{content:" ✔"}
  .ln .dc em{font-style:normal;font-weight:500;font-size:11.5px;opacity:.85;white-space:nowrap}
  .ln .dc em .okc{color:#1f9d55;font-weight:800;font-size:14px;opacity:1}
  .ln .dc.fin em .okc{color:#fff}
  .ln .dc b.x{cursor:pointer;color:#b00020;font-size:17px;line-height:1;padding:0 2px}
  .ln .dc.fin b.x{color:#ffd9d9}
  .ln .dc.empty{color:#6f7682;font-weight:400;font-style:italic;justify-content:center;min-height:60px}
  .ln>div.tot{background:var(--yellow);font-weight:800;color:#000;font-size:18px}
  .ln>div.chk{background:#fff}
  .ln>div.chk input{width:22px;height:22px;cursor:pointer;accent-color:#1e9e50}
  .ln>div.note{background:#fff;padding:4px;align-items:stretch}
  /* === Kartu statistik: ringkasan atas + kartu Line ringkas === */
  .stats{display:block}
  .st-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
  .st-sum .k{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .st-sum .k small{display:block;font-size:12px;color:var(--mute)}
  .st-sum .k b{font-size:22px;font-weight:800}
  .st-sum .k span{font-size:12.5px;color:var(--mute);margin-left:6px}
  .spb{height:8px;background:#dfe5ee;border-radius:5px;overflow:hidden;margin-top:5px}
  .spb i{display:block;height:100%}
  .st-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}
  .sc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sch{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;color:#111}
  .sch b{font-size:17px;font-weight:800}.sch small{font-size:12px;color:#333;font-weight:600}
  .scb{padding:12px 14px}
  .sbig{font-size:24px;font-weight:800;line-height:1.1}
  .sbig span{font-size:13px;color:var(--mute);font-weight:500;margin-left:6px}
  .srow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:9px}
  .srow em{font-style:normal;color:var(--mute)}
  .ssec{margin:14px 0 4px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute)}
  .sd{padding:8px 0;border-bottom:1px solid #eef1f6}.sd:last-of-type{border-bottom:0}
  .sdn{display:flex;gap:7px;align-items:flex-start;font-size:13px;font-weight:700;line-height:1.25}
  .sdn .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
  .sdm{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
  .sok{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:#146c3a;background:#e3f5ea;border-radius:7px;padding:6px 10px;margin-top:10px}
  .sfin{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:#4b5565;padding:6px 2px 0}
  .sfin .dcbox,.sdn .dcbox{font-size:12px}

  /* ===== pencarian: kolom per kategori, ringkas ===== */
  .cr-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .cr-top input[type=text]{flex:1 1 200px;max-width:340px;height:30px;font-size:12.5px;padding:4px 9px}
  .cr-top button{height:30px;padding:0 12px;font-size:12.5px}
  .cr-top .seg button{padding:0 11px}
  .cr-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,148px));gap:8px 10px}
  .cr-f{min-width:0}
  .cr-f.wide{grid-column:span 2}
  .cr-f label{display:block;font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cr-f input[type=text],.cr-f select{width:100%;height:28px;font-size:12px;padding:3px 7px;border-radius:5px}
  .cr-f select{padding-right:2px;background:#fbfcff}
  .cr-f.on input[type=text],.cr-f.on select{border-color:var(--brand);background:#eef4ff}
  button:disabled{opacity:.45;cursor:not-allowed}
  /* ===== kunci pembagian ===== */
  .bh .t{flex-direction:row;gap:12px}
  .lockbtn{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid #0a5566;background:#fff;color:#0a3f4d;cursor:pointer}
  .lockbtn.on{background:#c62828;border-color:#c62828;color:#fff}
  .board.locked{outline:3px solid #c62828;outline-offset:-3px}
  body.locked .dclist .dc{cursor:not-allowed;opacity:.8}
  body.locked .ln .dc b.x{display:none}
  body.locked .ln .note textarea{background:#f1f3f6;color:#555}
  body.locked .ln .dc input{cursor:not-allowed}
  /* ===== jendela pilih DC dikecualikan ===== */
  .ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:45;padding:14px}
  .ov.show{display:flex}
  .ex-box{background:#fff;border-radius:14px;width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:linear-gradient(180deg,#f3f7ff,#dfe8f8);border-bottom:1px solid #b9c7e0}
  .ex-h h3{margin:0;font-size:15px;flex:1}
  .ex-h h3 small{display:block;font-weight:500;color:#445;font-size:12px;margin-top:3px;line-height:1.35}
  .ex-lines{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
  .ex-lines label{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:14px;border:1px solid #0003;font-weight:700;cursor:pointer}
  .ex-lines label input{width:15px;height:15px}
  .ex-lines button{height:26px;padding:0 10px;font-size:12px;font-weight:700;border:1px solid #0003;border-radius:14px}
  .ex-lines label.off{background:#fff!important;color:#888;font-weight:600}
  .ex-lines small{width:100%;color:var(--mute);font-size:11.5px}
  .ex-tools{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
  .ex-tools input{flex:1;height:28px;font-size:12.5px}
  .ex-tools button{height:28px;padding:0 10px;font-size:12px}
  .ex-tools span{font-size:12px;color:var(--mute);white-space:nowrap}
  .ex-list{overflow:auto;min-height:120px;flex:1 1 auto}
  .exr{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;padding:6px 16px;border-bottom:1px solid #eef1f6;cursor:pointer;font-size:12.5px;font-weight:600}
  .exr:hover{background:#f4f8ff}
  .exr.on{background:#fff4d6}
  .exr input{width:16px;height:16px}
  .exr small{padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:700;color:#222;white-space:nowrap}
  .exr small.nl{background:#eceff3;color:#666;font-weight:600}
  .exr em{font-style:normal;font-weight:500;color:var(--mute);font-size:11.5px;white-space:nowrap}
  .ex-prev{padding:10px 16px;border-top:1px solid var(--line);background:#fafbfe}
  .ex-ph{font-size:12.5px;font-weight:700;margin-bottom:6px}
  .ex-ph small{font-weight:500;color:var(--mute);margin-left:6px}
  .ex-pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
  .exl{border:1px solid #0003;border-radius:7px;padding:5px 8px;font-size:12px;display:flex;flex-direction:column;line-height:1.3}
  .ex-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}

  /* ===== menu Catatan (kertas A4) ===== */
  #cat{display:none;padding:14px}
  body.v-cat #cat{display:block}
  body.v-cat main,body.v-cat #btnAuto,body.v-cat #btnMulti,body.v-cat #btnClear,body.v-cat #btnExport,body.v-cat #btnSave,body.v-cat #lineCtl{display:none}
  .cat-ctl{position:sticky;top:var(--hh,56px);z-index:4;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;box-shadow:0 2px 6px #0001}
  .cat-ctl .g{display:flex;flex-direction:column;gap:2px}
  .cat-ctl .g>label{font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .cat-ctl .g>label span{color:var(--brand);text-transform:none}
  .cat-ctl select,.cat-ctl input[type=number]{height:28px;font-size:12px;padding:2px 6px}
  .cat-ctl input[type=number]{width:58px;text-align:center}
  .cat-ctl input[type=range]{width:105px}
  .cat-ctl button{height:28px;padding:0 10px;font-size:12px}
  .cat-ctl .row{display:flex;gap:5px;align-items:center;font-size:12px;min-height:28px}
  .cat-ctl .seg button{height:28px;padding:0 11px}
  #cInfo{font-size:11.5px;color:#444;line-height:1.3;max-width:210px}
  #cInfo.warn{color:#b00020;font-weight:700}
  .cat-pages{display:flex;flex-direction:column;gap:18px;padding:18px 14px 30px;background:#dfe4ec;border-radius:10px;overflow:auto}
  .sheet-wrap{position:relative;flex:none;margin:0 auto;background:#fff;box-shadow:0 4px 18px rgba(20,35,70,.32)}
  .sheet{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--Wmm);height:var(--Hmm);box-sizing:border-box;background:#fff;color:#111;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ff);font-size:var(--fs)}
  .sh-head{display:flex;align-items:center;gap:4mm;padding-bottom:2.5mm;border-bottom:.7mm solid var(--ac);margin-bottom:3mm;flex:none}
  .sh-logo{width:40mm;height:12mm;object-fit:contain;object-position:left center;flex:none}
  .sh-tt{flex:1;min-width:0;text-align:right}
  .sh-title{font-size:1.45em;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;color:#111}
  .sh-sub{font-size:.85em;color:#444}
  .sh-foot{flex:none;text-align:right;font-size:.7em;color:#8a92a0;padding-top:1.5mm}
  .ed{outline:none;white-space:pre-wrap;word-break:break-word}
  .ed:empty::before{content:attr(data-ph);color:#b3bac7}
  @media screen{.ed:hover{outline:1px dashed #c3d3ee}.ed:focus{outline:1px dashed #6f9be0}}
  .inl{display:inline-block;min-width:32mm;white-space:nowrap}
  .sw{display:grid;grid-template-columns:repeat(4,13px);grid-auto-rows:13px;gap:2px}
  .cat-ctl .swb{width:13px;height:13px;padding:0;border:1px solid #0005;border-radius:3px;cursor:pointer}
  .cat-ctl .swb:hover{outline:2px solid var(--brand);outline-offset:1px}
  .cat-ctl input[type=color]{width:34px;height:28px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .fill{flex:1;min-height:0}
  .lined{color:var(--tc,#111);background-color:var(--bg,transparent);line-height:var(--rh);background-image:linear-gradient(to bottom,transparent calc(var(--rh) - 1px),#bcc5d4 calc(var(--rh) - 1px));background-size:100% var(--rh);background-attachment:local;overflow-y:auto;scrollbar-width:thin}
  .noln .lined{background-image:none}
  /* ===== PDF Catatan ===== */
  .pdfmode .ed:empty::before{content:none!important}
  .pdfmode .lined{overflow:hidden!important}
  .pdfmode .sheet{transform:none!important}
  .pdf-box{background:#fff;border-radius:14px;width:min(920px,100%);height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .pdf-h{padding:10px 14px;background:linear-gradient(180deg,#f3f7ff,#dfe8f8);border-bottom:1px solid #b9c7e0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  .pdf-h h3{margin:0;font-size:15px;flex:1 1 220px}
  .pdf-h h3 small{display:block;font-weight:500;color:#445;font-size:12px;margin-top:2px;word-break:break-all}
  .pdf-act{display:flex;flex-wrap:wrap;gap:6px}

<script>
const COLORS = ['#fff2cc','#b6d7a8','#c9daf8','#ead1dc','#fce5cd'];
const fmt = n => Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const isDone = r => { const v = r && r.done; return v === true || /^(true|ya|yes|1|done|selesai)$/i.test(String(v == null ? '' : v).trim()); };

let RAW = [];
let HEADS = {};            // judul kolom tiap blok dari Master Data
let S = { n:4, active:0, assign:{}, notes:{}, done:{}, doneDc:{}, excl:{}, autoLines:null, locked:false };
function guard(){ if (S.locked){ toast('🔒 Pembagian terkunci — klik tombol kunci untuk membuka'); return true; } return false; }
let DCS = [];               // hasil agregasi (terfilter)
let saveTimer = null;
const API_URL = 'https://script.google.com/macros/s/AKfycbyNLxeTtd0wrgXlpif1MtLFauRwdHZsASVWSnxdD7l_PGw4aZvD2bJh1rlFBSzIbeTm/exec';
const HAS_GAS = !!API_URL;

/* ---------- Pemanggil backend Apps Script lewat fetch ---------- */
async function gas(fn, ...args){
  if (!API_URL) return demo(fn);
  let res;
  if (fn === 'getMasterData' || fn === 'loadState' || fn === 'loadCatatan' || fn === 'loadPickHu'){
    const u = fn === 'loadPickHu'
      ? API_URL + '?action=loadPickHu&date=' + encodeURIComponent(args[0] || '') + '&shift=' + encodeURIComponent(args[1] || '') + '&to=' + encodeURIComponent(args[2] || '') + '&t=' + Date.now()
      : fn === 'loadCatatan'
      ? API_URL + '?action=loadCatatan&since=' + encodeURIComponent(args[0] || '') + '&t=' + Date.now()
      : API_URL + '?action=' + fn + '&shift=' + encodeURIComponent(args[0] || '') + '&t=' + Date.now();
    res = await fetch(u);
  } else {
    const body = fn === 'saveState' ? { action:fn, shift:args[0], state:args[1] }
      : fn === 'saveCatatan' ? { action:fn, data:args[0], v:args[1] }
      : fn === 'savePickHu' ? { action:fn, entry:args[0] }
      : fn === 'deletePickHu' ? { action:fn, id:args[0] }
      : fn === 'deletePickHuMany' ? { action:fn, ids:args[0] } : { action:fn, payload:args[0] };
    res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body) });
  }
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j.data;
}
function demo(fn){
  if (fn !== 'getMasterData') return null;
  const d = [['STOCK-PARAMA RDC BANJARMASIN',61,50935],['STOCK-PARAMA DC SURABAYA',55,15911],['STOCK-PARAMA DC SOLO',37,13616],
    ['FC NGANJUK-PARAMA FC ECOMMERCE NGANJUK',42,9949],['STOCK-PARAMA DC SEMARANG',20,4697],['FC FATMAWATI-PARAMA FC FATMAWATI',49,2325],
    ['PALEM FG-PARAMA HEAD OFFICE',21,968],['FC FATMAWATI-PARAMA FC SRENGSENG',10,472],['STOCK-PARAMA DC SUKABUMI',4,456],['FC BANJARMSN-PARAMA RDC BANJARMASIN',1,20]];
  const rows = [];
  d.forEach(([dc,wo,pcs]) => { for(let i=0;i<wo;i++) rows.push({s:i%5?1:2,dc,wo:dc.slice(0,3)+i,qty:i===wo-1?pcs-Math.floor(pcs/wo)*(wo-1):Math.floor(pcs/wo),done:i%4===0,picker:''}); });
  return {rows, updated:new Date().toISOString()};
}

/* ---------- Agregasi (seperti gambar 1) ---------- */
function aggregate(){
  const src = $('fSrc').value, hideDone = $('fDone').checked, q = $('fSearch').value.trim().toUpperCase();
  const m = new Map();
  RAW.forEach(r => {
    if (src !== 'all' && String(r.s) !== src) return;
    if (hideDone && isDone(r)) return;
    let o = m.get(r.dc);
    if (!o) m.set(r.dc, o = { dc:r.dc, wos:new Set(), pcs:0, srcs:new Set() });
    o.wos.add(r.wo || ('row' + Math.random()));
    o.pcs += r.qty;
    o.srcs.add(r.s);
  });
  DCS = [...m.values()].map(o => ({ dc:o.dc, wo:o.wos.size, pcs:o.pcs, srcs:[...o.srcs] }))
        .sort((a,b) => b.pcs - a.pcs);
  return q ? DCS.filter(d => d.dc.includes(q)) : DCS;
}

/* ---------- Render daftar DC ---------- */
function renderList(){
  const list = aggregate();
  const tWo = DCS.reduce((a,d)=>a+d.wo,0), tPcs = DCS.reduce((a,d)=>a+d.pcs,0);
  $('sumShift').textContent = 'SHIFT ' + $('shift').value;
  $('sumWo').textContent = fmt(tWo); $('sumPcs').textContent = fmt(tPcs);
  $('dcList').innerHTML = list.map(d => {
    const li = S.assign[d.dc];
    const taken = li !== undefined && li < S.n;
    const tag = taken ? `<small style="background:${COLORS[li]}">LINE ${li+1}</small>` : '';
    const xtag = S.excl && S.excl[d.dc] ? `<small style="background:#e5e7eb" title="Tidak ikut pembagian otomatis">🚫 manual</small>` : '';
    return `<div class="dc ${taken?'taken':''}" data-dc="${encodeURIComponent(d.dc)}">
      <div class="n"><input type="checkbox" ${taken?'checked':''} tabindex="-1"></div>
      <div class="name">${esc(d.dc)}${tag}${xtag}</div>
      <div class="num">${d.wo}</div><div class="num">${fmt(d.pcs)}</div></div>`;

function progMap(){                       // total & selesai per DC dari spreadsheet (baris DONE = TRUE)
  const src = $('fSrc').value, m = new Map();
  RAW.forEach((r, idx) => {
    if (src !== 'all' && String(r.s) !== src) return;
    let o = m.get(r.dc); if (!o) m.set(r.dc, o = { wm:new Map(), pcs:0, donePcs:0 });
    const d = isDone(r), q = +r.qty || 0, wk = r.wo || ('row' + idx);
    o.wm.set(wk, (o.wm.has(wk) ? o.wm.get(wk) : true) && d); o.pcs += q; if (d) o.donePcs += q;
  });

  return m;
}
const snapKey = () => 'pl_snap_' + $('shift').value + '_' + new Date().toLocaleDateString('sv-SE');
function recordSnap(){                    // catat progres tiap muat data → dasar hitung kecepatan
  try {
    const k = snapKey(), a = JSON.parse(localStorage.getItem(k) || '[]'), now = Date.now();
    if (a.length && now - a[a.length-1].t < 30000) return;
    const dc = {}; progMap().forEach((o, n) => { dc[n] = o.donePcs; });
    a.push({ t:now, dc }); localStorage.setItem(k, JSON.stringify(a.slice(-240)));
  } catch(e){}
}
const pcol = p => p >= 100 ? '#38bdf8' : p >= 80 ? '#1f9d55' : p >= 40 ? '#f59e0b' : '#d93025';   // merah = baru mulai, oranye = setengah, hijau = hampir/selesai
const hhmm = t => new Date(t).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
const fmtDur = m => m > 1440 ? 'lebih dari 24 jam' : (m >= 60 ? Math.floor(m/60) + ' j ' + Math.round(m%60) + ' mnt' : Math.max(1, Math.round(m)) + ' mnt');
function progFor(items, PM){
  const P = { items, wo:0, doneWo:0, pcs:0, donePcs:0 };
  items.forEach(d => {
    const p = PM.get(d.dc) || { wo:0, doneWo:0, pcs:0, donePcs:0 }, chk = !!S.doneDc[d.dc];   // DC diceklis = dianggap selesai semua
    P.wo += p.wo; P.pcs += p.pcs; P.doneWo += chk ? p.wo : p.doneWo; P.donePcs += chk ? p.pcs : p.donePcs;
  });

}
function etaOf(P, PM){
  const remain = P.pcs - P.donePcs;
  if (P.pcs > 0 && remain <= 0) return { txt:'Selesai ✔', ok:true };
  let a = []; try { a = JSON.parse(localStorage.getItem(snapKey()) || '[]'); } catch(e){}
  const now = Date.now(), base = a.find(x => now - x.t <= 90*60000);
  if (!base) return { txt:'ETA: menunggu data, muat ulang beberapa menit lagi' };
  const mins = (now - base.t) / 60000;
  if (mins < 5) return { txt:'ETA: butuh data ≥ 5 menit (sejak ' + hhmm(base.t) + ')' };
  let delta = 0;
  P.items.forEach(d => { const p = PM.get(d.dc); if (!p) return; const b = base.dc[d.dc]; delta += Math.max(0, p.donePcs - (b === undefined ? p.donePcs : b)); });
  if (delta <= 0) return { txt:'ETA: belum ada pcs selesai sejak ' + hhmm(base.t) };
  const rate = delta / mins, left = remain / rate;
  return { txt:'ETA ' + hhmm(now + left*60000) + ' · ±' + fmtDur(left) + ' lagi · ' + fmt(rate*60) + ' pcs/jam' };
}
function progCard(P, PM){
  if (!P.items.length || !P.pcs) return '';

  return `<div class="lprog"><div class="pl"><span>PCS</span><b>${fmt(P.donePcs)}/${fmt(P.pcs)}</b><em>${pp}%</em></div>${bar(pp, true)}
    <div class="pl"><span>WO</span><b>${P.doneWo}/${P.wo}</b><em>${pw}%</em></div>${bar(pw, false)}<div class="eta ${e.ok?'ok':''}">${e.txt}</div></div>`;
}

const ketOf = r => {

let REK = [];
function aggRekap(){

const CMAIN = new Set(['DO','BIN','KET','PICKER','QTY','WO','DC']);
const normLbl = h => { h = String(h == null ? '' : h).trim().toUpperCase();
  if (/^(DO|NO[_ ]?DO|NOMOR[_ ]?DO)$/.test(h)) return 'DO'; if (/BIN/.test(h)) return 'BIN'; if (/^KET/.test(h)) return 'KET';
  if (/PICKER|OPERATOR/.test(h)) return 'PICKER'; if (/^(QTY|QUANTITY)$/.test(h)) return 'QTY'; if (h === 'WO') return 'WO'; if (h === 'DC') return 'DC'; return h; };

  (r.cols || []).forEach((v, i) => { const n = normLbl(hd[i]), t = String(v == null ? '' : v).trim(); if (CMAIN.has(n) && cm[n] === undefined && t) cm[n] = t; });
  const F = [], dk = pickKey(r, DO_RE);
  const add = (label, vals, kind, main) => F.push({ label, kind, main, vals: vals.map(x => String(x == null ? '' : x).trim()).filter(Boolean) });
  add('DC', [r.dc]);
  add('WO', flat(r.wo), '', true);
  if (dk) add('DO', doList(r), '', true); else if (cm.DO) add('DO', flat(cm.DO), '', true);
  add('QTY', [r.qty != null && r.qty !== '' ? r.qty : cm.QTY], '', true);
  add('Operator', [r.picker || cm.PICKER], 'opr', true);
  add('Keterangan', [ketOf(r) || cm.KET], 'ket', true);
  add('Bin Fisik', [binOf(r) || cm.BIN], '', true);

/* ---------- Bagi otomatis: WO & PCS dibuat serempak merata ---------- */
function balanceAssign(excl, lines){
  const L = lines.slice().sort((a, b) => a - b), n = L.length, loc = new Map(L.map((li, j) => [li, j]));
  const base = Array.from({ length:n }, () => ({ wo:0, pcs:0 })), items = [];
  let freeExcl = 0;
  DCS.forEach(d => {
    const li = S.assign[d.dc], has = li !== undefined && li < S.n;
    if (has && !loc.has(li)) return;                 // DC di Line yang tidak ikut dibagi (manual): dibiarkan
    if (excl[d.dc]){                                 // DC dikecualikan: tidak dipindah, tetap dihitung sbg beban Line-nya
      if (has){ base[loc.get(li)].wo += d.wo; base[loc.get(li)].pcs += d.pcs; } else freeExcl++;
    } else items.push(d);
  });
  if (!n) return { assign:{}, loads:[], lines:L, freeExcl, dWo:0, dPcs:0 };
  const sw = items.reduce((a, d) => a + d.wo, 0) + base.reduce((a, b) => a + b.wo, 0);
  const sp = items.reduce((a, d) => a + d.pcs, 0) + base.reduce((a, b) => a + b.pcs, 0);
  const tW = (sw / n) || 1, tP = (sp / n) || 1, m = items.length;
  const cost = Ld => {                               // simpangan WO & PCS terhadap rata-rata, dinormalkan sama rata
    let c = 0, mx = 0;
    for (let i = 0; i < n; i++){
      const a = (Ld[i].wo - tW) / tW, b = (Ld[i].pcs - tP) / tP;
      c += a * a + b * b; mx = Math.max(mx, Math.abs(a), Math.abs(b));
    }
    return c + 0.5 * mx * mx;
  };
  const run = order => {
    const ld = base.map(b => ({ wo:b.wo, pcs:b.pcs })), asg = new Array(m).fill(0);
    const mv = (k, from, to) => { const d = items[k]; ld[from].wo -= d.wo; ld[from].pcs -= d.pcs; ld[to].wo += d.wo; ld[to].pcs += d.pcs; };
    order.forEach(k => {                             // tahap 1: tempatkan satu per satu ke Line yang paling memperbaiki keseimbangan
      const d = items[k]; let bi = 0, bc = Infinity;
      for (let j = 0; j < n; j++){ ld[j].wo += d.wo; ld[j].pcs += d.pcs; const c = cost(ld); ld[j].wo -= d.wo; ld[j].pcs -= d.pcs; if (c < bc - 1e-12){ bc = c; bi = j; } }
      asg[k] = bi; ld[bi].wo += d.wo; ld[bi].pcs += d.pcs;
    });
    let cur = cost(ld);
    for (let pass = 0; pass < 60; pass++){           // tahap 2: perbaiki dengan pindah & tukar DC antar Line
      let imp = false;
      for (let k = 0; k < m; k++) for (let j = 0; j < n; j++){
        const a = asg[k]; if (j === a) continue;
        mv(k, a, j); const c = cost(ld);
        if (c < cur - 1e-12){ cur = c; asg[k] = j; imp = true; } else mv(k, j, a);
      }
      for (let k = 0; k < m; k++) for (let q = k + 1; q < m; q++){
        const a = asg[k], b = asg[q]; if (a === b) continue;
        mv(k, a, b); mv(q, b, a); const c = cost(ld);
        if (c < cur - 1e-12){ cur = c; asg[k] = b; asg[q] = a; imp = true; } else { mv(k, b, a); mv(q, a, b); }
      }
      if (!imp) break;
    }
    return { ld, asg, cur };
  };
  const w = d => d.pcs / tP + d.wo / tW;
  const idx = items.map((_, k) => k);
  let seed = 20260705; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  let best = run(idx.slice().sort((x, y) => w(items[y]) - w(items[x])));
  for (let r = 0; r < 12 && m > 1; r++){             // beberapa percobaan urutan berbeda, ambil yang paling rata
    const o = idx.map(k => [k, w(items[k]) * (0.7 + 0.6 * rnd())]).sort((x, y) => y[1] - x[1]).map(x => x[0]);
    const res = run(o); if (res.cur < best.cur - 1e-12) best = res;
  }
  const assign = {}; items.forEach((d, k) => { assign[d.dc] = L[best.asg[k]]; });
  const wos = best.ld.map(l => l.wo), pcs = best.ld.map(l => l.pcs);
  return { assign, loads:best.ld, lines:L, freeExcl, dWo:Math.max(...wos) - Math.min(...wos), dPcs:Math.max(...pcs) - Math.min(...pcs) };
}

/* ---------- PDF Catatan: lihat, buka di aplikasi lain, bagikan, unduh ---------- */
const libLoad = {};
function loadScript(src){
  return libLoad[src] || (libLoad[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete libLoad[src]; rej(new Error('Pustaka PDF gagal dimuat (perlu koneksi internet)')); };
    document.head.appendChild(el);
  }));
}
async function loadPdfLibs(){
  if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
let LOGO_DATA = '';
async function catLogoData(){                                   // logo jadi data-URL agar tidak terblokir CORS saat dirender ke PDF
  if (LOGO_DATA || !LOGO) return LOGO_DATA;
  try {
    const r = await fetch(LOGO, { mode:'cors', cache:'no-cache' }); if (!r.ok) throw 0;
    const b = await r.blob();
    LOGO_DATA = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); });
  } catch(e){ LOGO_DATA = ''; }
  return LOGO_DATA;
}
const catPdfName = () => 'Catatan_' + new Date().toLocaleDateString('sv-SE') + '.pdf';
function catSheetHtml(p, i, n, W, H, logo){
  let head = catHead(p); if (logo) head = head.split(LOGO).join(logo);
  return `<div class="sheet ${CAT.ln ? '' : 'noln'}" style="--ac:#1b2430;--rh:${CAT.rh * MM}px;--fs:${CAT.fs}pt;--ff:${esc(CAT.ff)};--tc:${CAT.tc};--bg:${CAT.bg || 'transparent'};padding:${CAT.mg}mm;width:${W}mm;height:${H}mm;position:absolute;left:0;top:0;transform:none">
    ${head}${catEd(p, 'lined.body', '', 'lined fill')}<div class="sh-foot">Hal ${i + 1} / ${n}</div></div>`;
}
let PDFC = null, pdfBusy = false;
async function catBuildPdf(){
  await loadPdfLibs();
  const { W, H } = catDims(), n = CAT.pages.length, sig = catPayload() + '|' + CAT.o;
  if (PDFC && PDFC.sig === sig) return PDFC;
  const logo = CAT.lg ? await catLogoData() : '';
  const scale = n > 8 ? 1.5 : 2, imgs = [];
  const pdf = new window.jspdf.jsPDF({ orientation: W > H ? 'l' : 'p', unit:'mm', format:'a4', compress:true });
  const box = document.createElement('div');
  box.className = 'pdfmode';
  box.style.cssText = `position:fixed;left:0;top:0;width:${W}mm;height:${H}mm;z-index:-1;background:#fff;overflow:hidden`;
  document.body.appendChild(box);
  try {
    for (let i = 0; i < n; i++){
      $('loaderMsg').textContent = 'Membuat PDF… halaman ' + (i + 1) + ' / ' + n;
      box.innerHTML = catSheetHtml(CAT.pages[i], i, n, W, H, logo);
      await Promise.all([...box.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
      const cv = await window.html2canvas(box, { scale, useCORS:true, backgroundColor:'#ffffff', logging:false, windowWidth:1200, scrollX:0, scrollY:0 });
      const jpg = cv.toDataURL('image/jpeg', .92);
      imgs.push(jpg);
      if (i) pdf.addPage();
      pdf.addImage(jpg, 'JPEG', 0, 0, W, H, undefined, 'FAST');
      await new Promise(r => setTimeout(r, 0));                 // beri napas ke browser (HP)
    }
  } finally { box.remove(); }
  if (PDFC && PDFC.url) URL.revokeObjectURL(PDFC.url);
  const blob = pdf.output('blob');
  PDFC = { sig, blob, imgs, url:URL.createObjectURL(blob), name:catPdfName() };
  return PDFC;
}
async function catGetPdf(){
  if (pdfBusy) return null;
  pdfBusy = true; showLoader('Membuat PDF…');
  try { return await catBuildPdf(); }
  catch(e){ toast('Gagal membuat PDF: ' + (e.message || e) + ' — coba tombol Cetak lalu "Simpan sebagai PDF"'); return null; }
  finally { pdfBusy = false; hideLoader(); }
}
function dlBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

const pkId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const pkIso = d => d.toLocaleDateString('sv-SE');

const pkWeek = iso => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return Array.from({ length:7 }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return pkIso(x); }); };

const PK_SECS = [['Dokumen', /^(wo|do|wt|wo baru)$/i, 'c3', ['WO','DO','WT','WO BARU']],

const pkCls = (label, v) => /^bin fisik$/i.test(label) ? 'binf' : /^qty$/i.test(label) ? 'qtyc' : /^pallet$/i.test(label) ? 'palc'
  : /^done$/i.test(label) ? (/^(true|ya|selesai)$/i.test(v) ? 'trc' : 'fac') : '';
function pkCardHtml(c){
  if (!c) return '';
  const f = c.fields || [];
  const hue = t => { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  const chip = (v, cls, extra) => `<span class="cf ${cls || ''}" ${extra || ''}>${esc(v).replace(/\n/g, '<br>')}</span>`;
  const val = x => !x.vals.length ? '<span class="cf nil">-</span>' : x.vals.map(v =>
    x.kind === 'ket' ? chip(v, 'ket has', `style="--kh:${hue(v)}"`) : chip(v, x.kind === 'opr' ? 'opr' : pkCls(x.label, v))).join('');
  const fld = x => `<div class="fld ${x.kind || ''}"><div class="cf-l">${x.kind === 'opr' ? '👤 ' : x.kind === 'ket' ? '📝 ' : ''}${esc(x.label)}</div><div class="cf-v">${val(x)}</div></div>`;
  const top = f.filter(x => x.kind), rest = f.filter(x => !x.kind), used = new Set();
  const ord = (a, list) => list.indexOf(String(a.label).toUpperCase());
  const secs = PK_SECS.map(([t, re, g, list]) => {
    const it = rest.filter(x => re.test(x.label)); it.forEach(x => used.add(x)); it.sort((a, b) => ord(a, list) - ord(b, list));
    return it.length ? `<div class="cc-sec"><div class="cc-st">${t}</div><div class="cc-sg ${g}">${it.map(x => `<div class="fld ${x.vals.length > 2 ? 'span' : ''}"><div class="cf-l">${esc(x.label)}</div><div class="cf-v">${val(x)}</div></div>`).join('')}</div></div>` : '';
  }).join('');
  const oth = rest.filter(x => !used.has(x));
  const othH = oth.length ? `<div class="cc-sec"><div class="cc-st">Lainnya</div><div class="cc-sg c2">${oth.map(x => `<div class="fld"><div class="cf-l">${esc(x.label)}</div><div class="cf-v">${val(x)}</div></div>`).join('')}</div></div>` : '';
  return `<div class="cc pk-cc ${c.done ? 'ok' : 'no'}"><div class="cc-h"><span class="cf dcn">${esc(c.dc)}</span><span class="pill ${c.done ? 'ok' : 'no'}">${c.done ? '✔ Selesai' : '✖ Belum'}</span></div>

}

const pkKey = () => { const wk = pkWeek(PK.date); return wk[0] + '|' + wk[6] + '|' + PK.shift; };
const pkMap = (r, wk) => r.map(x => ({ id:x.id, tgl:x.tgl || wk[0], shift:String(x.shift || '3'), area:x.area || '', pick:x.pick || '', card:pkJson(x.card), photo:x.photo || '',
  kind: x.photo ? 'photo' : (x.card ? 'card' : ''), saved:true, dirty:false }));
/* gabungkan data server dengan isian lokal yang belum disimpan (tidak ikut tertimpa) */
function pkMerge(loaded){
  const local = new Map(PK.list.map(e => [e.id, e])), out = loaded.map(e => { const l = local.get(e.id); return l && l.dirty ? l : e; }), ids = new Set(out.map(e => e.id));
  PK.list.forEach(e => { if (!ids.has(e.id) && (!e.saved || e.dirty)) out.push(e); });
  return out;
}
function pkCacheSync(){ PK.cache.clear(); PK.cache.set(pkKey(), PK.list.filter(e => e.saved && !e.dirty).map(e => ({ ...e }))); }
const pkTyping = () => { const ae = document.activeElement; return !!(ae && ae.closest && ae.closest('#pick') && ae.matches('input,select,textarea')); };
/* tampil langsung dari cache (tanpa layar loading); data terbaru diambil diam-diam di belakang */
async function pkLoadList(quiet){
  const wk = pkWeek(PK.date), key = pkKey(), cached = PK.cache.get(key);
  if (!quiet || !cached){ PK.list = pkMerge(cached ? cached.map(e => ({ ...e })) : []); PK.busy = !cached; renderPick(); }
  try {
    const fresh = pkMap(await pkLoadRemote(wk[0], wk[6], PK.shift), wk);
    if (key !== pkKey()) return;                                   // pindah minggu / shift saat memuat
    const same = cached && JSON.stringify(cached) === JSON.stringify(fresh);
    PK.cache.set(key, fresh);
    if (!same && (!cached || !pkTyping())){ PK.list = pkMerge(fresh.map(e => ({ ...e }))); PK.busy = false; renderPick(); }
  } catch(err){ if (!cached) toast('Gagal memuat: ' + (err.message || err)); }
  finally { if (PK.busy){ PK.busy = false; const el = $('pkBusy'); if (el) el.textContent = ''; } }
}

  PK.shift = $('shift').value || '3';
  const wk = pkWeek(PK.date), key = pkKey();

}

async function pkSave(en){

async function pkDeleteWeek(){
  const wk = pkWeek(PK.date), L = PK.list.filter(x => wk.includes(x.tgl));
  if (!L.length){ toast('Tidak ada data minggu ini'); return; }
  const nSaved = L.filter(x => x.saved).length;

  showLoader('Menghapus ' + L.length + ' data…');
  try {

      if (!HAS_GAS) { for (const id of ids) await pkDeleteRemote(id); }
      else {
        try { await gas('deletePickHuMany', ids); }
        catch(err){
          if (!/tidak dikenal/i.test(String(err.message || err))) throw err;          // Code.gs lama: hapus satu-satu

async function pkDelete(en){

/* foto upload: kecilkan agar muat penyimpanan (≤ 240.000 karakter) */
async function pkResize(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Foto tidak bisa dibaca')); i.src = url; });
    let w = Math.min(img.naturalWidth, 760), q = .62, out = '';
    for (let k = 0; k < 7; k++){
      const cv = document.createElement('canvas'); cv.width = w; cv.height = Math.round(img.naturalHeight * w / img.naturalWidth);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      out = cv.toDataURL('image/jpeg', q); if (out.length <= 240000) return out;
      w = Math.round(w * .85); q = Math.max(.45, q - .05);
    }
    throw new Error('Foto terlalu besar');
  } finally { URL.revokeObjectURL(url); }
}

async function pkImage(html, w, name){
  showLoader('Membuat gambar…');
  const box = document.createElement('div');
  try {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    box.style.cssText = `position:fixed;left:0;top:0;width:${w}px;z-index:-1;background:#fff`; box.innerHTML = html; document.body.appendChild(box);
    await Promise.all([...box.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const cv = await window.html2canvas(box, { scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false, windowWidth:Math.max(w, 400) });
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    dlBlob(blob, name); toast('Gambar diunduh: ' + name);
  } catch(err){ toast('Gagal membuat gambar: ' + (err.message || err)); }
  finally { box.remove(); hideLoader(); }
}
const pkSafe = t => String(t || '').replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '');

$('pick').addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.pf; if (!f) return;
  const box = t.closest('.pk-ent'); const en = PK.list.find(x => x.id === box.dataset.id); if (!en) return;
  en[f] = t.value; en.dirty = true;
  const st = box.querySelector('.pk-st'); st.className = 'pk-st no'; st.textContent = '● Belum disimpan';
});
const pkGo = fn => { if (pkDirty() && !confirm('Ada data yang belum disimpan. Tetap pindah?')) { renderPick(); return; } fn(); pkLoadList(); };
$('pick').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pkDate'){ if (!t.value){ t.value = PK.date; return; } pkGo(() => { PK.date = t.value; }); }
});
$('pick').addEventListener('click', async e => {
  const pb = e.target.closest('[data-pb]');
  if (pb){
    const a = pb.dataset.pb, wk = pkWeek(PK.date);
    if (a === 'add'){
      const d = pb.dataset.d || (wk.includes(pkToday()) ? pkToday() : wk[0]);
      const en = { id:pkId(), tgl:d, shift:PK.shift === 'all' ? ($('shift').value || '3') : PK.shift, area:'', pick:'', kind:'', card:null, photo:'', saved:false, dirty:true };
      PK.list.push(en); renderPick();
      const el = $('pick').querySelector('[data-id="' + en.id + '"]');
      if (el){ el.scrollIntoView({ block:'center', behavior:'smooth' }); const inp = el.querySelector('[data-pf="area"]'); if (inp) setTimeout(() => inp.focus({ preventScroll:true }), 250); }
    } else if (a === 'prev') pkGo(() => { PK.date = pkShiftDate(wk[0], -7); });
    else if (a === 'next') pkGo(() => { PK.date = pkShiftDate(wk[0], 7); });
    else if (a === 'thisweek') pkGo(() => { PK.date = pkToday(); });
    else if (a === 'delweek') pkDeleteWeek();
    else if (a === 'reload'){
      if (pkDirty() && !confirm('Ada data yang belum disimpan. Muat ulang akan membuangnya. Lanjut?')) return;
      pkLoadList();
    } else if (a === 'all' || a === 'dayimg'){
      const L = (a === 'dayimg' ? PK.list.filter(x => x.tgl === pb.dataset.d) : PK.list.filter(x => wk.includes(x.tgl)))
        .slice().sort((x, y) => x.tgl.localeCompare(y.tgl) || x.shift.localeCompare(y.shift));
      if (!L.length){ toast('Tidak ada data untuk diunduh'); return; }
      const c = Math.min(3, L.length), w = c * 380 + (c + 1) * 14;
      pkImage(`<div class="pk-all">${L.map(pkRepHtml).join('')}</div>`, w, 'PickHU_' + (a === 'dayimg' ? pb.dataset.d : wk[0] + '_sd_' + wk[6]) + '.png');
    }
    return;
  }
  const b = e.target.closest('[data-pa]'); if (!b) return;
  const box = b.closest('.pk-ent'), en = PK.list.find(x => x.id === box.dataset.id); if (!en) return;
  const a = b.dataset.pa;
  if (a === 'save') pkSave(en);
  else if (a === 'del') pkDelete(en);
  else if (a === 'pick') pkStartPick(en.id);
  else if (a === 'upl'){ PK.upFor = en.id; $('pkFile').value = ''; $('pkFile').click(); }
  else if (a === 'clr'){ en.kind = ''; en.card = null; en.photo = ''; en.dirty = true; renderPick(); }
  else if (a === 'img') pkImage(pkRepHtml(en), 380, 'PickHU_' + (pkSafe(en.pick) || 'tanpa-no') + '_' + en.tgl + '.png');
});
$('pkFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0], en = PK.list.find(x => x.id === PK.upFor); if (!f || !en) return;
  showLoader('Memproses foto…');
  try { en.photo = await pkResize(f); en.kind = 'photo'; en.card = null; en.dirty = true; renderPick(); }
  catch(err){ toast('Gagal: ' + (err.message || err)); }
  finally { hideLoader(); }
});

/* ---------- Sinkron Catatan A4 antar perangkat (zoom tetap milik tiap perangkat) ---------- */
let CAT_V = '', catDirty = false, catSaving = false, catPushTm = null;
const catPayload = () => { const o = Object.assign({}, CAT); delete o.z; return JSON.stringify(o); };
function catQueuePush(){ if (!HAS_GAS) return; catDirty = true; clearTimeout(catPushTm); catPushTm = setTimeout(catPush, 1500); }
async function catPush(){
  if (!HAS_GAS) return;
  if (catSaving){ clearTimeout(catPushTm); catPushTm = setTimeout(catPush, 1500); return; }
  const data = catPayload(), v = String(Date.now());
  catSaving = true; catDirty = false;
  try { await gas('saveCatatan', data, v); CAT_V = v; }
  catch(e){ catDirty = true; clearTimeout(catPushTm); catPushTm = setTimeout(catPush, 15000); }   // gagal (offline / Apps Script belum di-deploy ulang): coba lagi
  finally { catSaving = false; }
}
function catApply(d){
  const z = CAT.z;
  try { const o = JSON.parse(d); if (!o || !Array.isArray(o.pages) || !o.pages.length) return false; Object.assign(CAT, o); CAT.z = z; } catch(e){ return false; }
  try { localStorage.setItem('pl_catatan2', JSON.stringify(CAT)); } catch(e){}
  return true;
}
async function catPoll(first){
  if (!HAS_GAS || document.hidden || catDirty || catSaving) return;
  let r; try { r = await gas('loadCatatan', CAT_V); } catch(e){ return; }
  if (!r || catDirty || catSaving || r.same) return;
  if (!r.data){ if (first === true) catQueuePush(); return; }          // server masih kosong → isi dari perangkat ini
  const ae = document.activeElement;
  if (ae && ae.closest && (ae.closest('#catPages') || ae.closest('#catCtl')) && ae.matches('.ed,input,select,textarea')) return;   // sedang mengedit: tunda
  if (!catApply(r.data)) return;
  CAT_V = r.v;
  if (document.body.classList.contains('v-cat')){ renderCat(); toast('📝 Catatan diperbarui dari perangkat lain'); }
}
setInterval(() => catPoll(), 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) catPoll(); });
catPoll(true);

/* ---------- Simpan / muat ---------- */
let lastServer = null, dirty = false, saving = false;   // sinkron antar perangkat: versi terakhir di server, ada perubahan lokal belum tersimpan, sedang menyimpan
function mkState(st){
  const o = Object.assign({ n:4, active:0, assign:{}, notes:{}, done:{}, doneDc:{}, excl:{}, autoLines:null, locked:false }, st || {});
  if (!o.doneDc) o.doneDc = {}; if (!o.excl) o.excl = {}; o.locked = !!o.locked; return o;
}
function queueSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(false), 1500); }
async function saveNow(show, keyOverride){
  const key = keyOverride || $('shift').value, snap = JSON.stringify(S);
  saving = true; dirty = false;
  try {
    if (HAS_GAS) await gas('saveState', key, JSON.parse(snap)); else localStorage.setItem('pl_' + key, snap);
    if (key === $('shift').value) lastServer = snap;
    if (show) toast('Tersimpan');
  } catch (e) { dirty = true; if (show) toast('Gagal menyimpan'); }
  finally { saving = false; }
}
async function loadShift(){
  let st = null;
  try { st = HAS_GAS ? await gas('loadState', $('shift').value) : JSON.parse(localStorage.getItem('pl_' + $('shift').value) || 'null'); } catch(e){}
  lastServer = st ? JSON.stringify(st) : null; dirty = false;
  S = mkState(st);
  markSeg(); render();
}
/* Sinkron otomatis: perubahan dari perangkat lain (catatan, pembagian DC, ceklis, kunci) langsung ikut tampil */
async function pollState(){
  if (!HAS_GAS || document.hidden || dirty || saving) return;
  const sh = $('shift').value;
  let st; try { st = await gas('loadState', sh); } catch(e){ return; }
  if ($('shift').value !== sh || dirty || saving) return;
  const j = st ? JSON.stringify(st) : null;
  if (!st || j === lastServer) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === 'TEXTAREA') return;           // sedang mengetik catatan: tunda, dicoba lagi siklus berikutnya
  lastServer = j;
  const act = S.active;                                   // Line aktif tetap milik perangkat ini
  S = mkState(st); S.active = act < S.n ? act : 0;
  markSeg(); render(); toast('🔄 Pembagian diperbarui dari perangkat lain');
}
setInterval(pollState, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollState(); });
async function loadData(show, silent){
  if (silent && document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;   // jangan ganggu saat mengetik catatan
  if (!silent){ showLoader('Memuat data Shift ' + $('shift').value + '…'); showSkeleton(); }
  const sc = $('dcList').scrollTop;
  try {
    const r = await gas('getMasterData', $('shift').value);
    RAW = r.rows; HEADS = r.heads || {}; scanDone();
    $('updInfo').textContent = 'Update ' + new Date(r.updated).toLocaleTimeString('id-ID');
    if (show) toast('Data dimuat: ' + RAW.length + ' baris');
    recordSnap();
  } catch (e) { if (!silent) toast('Gagal memuat data: ' + (e.message || e)); }
  render();
  if (silent) $('dcList').scrollTop = sc; else { hideLoader(); pop('dcList','board','stats','rekap'); }
}
let autoT = null;
function startAuto(){
  clearInterval(autoT);
  if ($('autoRef').checked) autoT = setInterval(() => { if (!document.hidden) loadData(false, true); }, 30000);
}
$('autoRef').addEventListener('change', e => { startAuto(); toast(e.target.checked ? 'Data dimuat ulang otomatis tiap 30 detik' : 'Auto update dimatikan'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('autoRef').checked) loadData(false, true); });   // balik ke tab/aplikasi → langsung segarkan
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

function tick(){
  const d = new Date();
  $('clock').innerHTML = '<span>' + d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) + '</span><b>' + d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' }).replace(/\./g, ':') + '</b>';
}
tick(); setInterval(tick, 1000);
(async () => { syncSrc(); await loadData(false); pkPrefetch(); await loadShift(); startAuto(); })();
</script>
