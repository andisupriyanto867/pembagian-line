<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembagian Line</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#1b2430; --mute:#6b7685; --line:#d9dfe8;
    --brand:#0b5ed7; --cyan:#00e5ff; --yellow:#ffff00;
    --l1:#fff2cc; --l2:#b6d7a8; --l3:#c9daf8; --l4:#ead1dc; --l5:#fce5cd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0 12px 0 0}
  .ctl{display:flex;align-items:center;gap:6px;font-size:13px}
  select,input[type=text],textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;background:#fff}
  button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
  button:hover{background:#eef3ff}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{background:#0a4fb5}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 14px}
  .seg button.on{background:var(--brand);color:#fff}
  main{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:14px;padding:14px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h2{margin:0;padding:10px 12px;font-size:14px;background:#f8fafd;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

  /* ringkasan (gambar 1) */
  .sum{display:grid;grid-template-columns:1fr 70px 90px;background:var(--yellow);font-weight:700;text-align:center;border-bottom:1px solid #000}
  .sum div{padding:8px;border-left:1px solid #000}
  .sum div:first-child{border-left:0;background:#6d9eeb;color:#000}
  .filters{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .filters input[type=text]{flex:1;min-width:120px}
  .lh{display:grid;grid-template-columns:34px 1fr 56px 78px;padding:6px 10px;font-size:12px;font-weight:700;text-align:center;border-bottom:1px solid #000;background:#fff}
  .lh div:nth-child(2){text-align:left}
  .dclist{max-height:calc(100vh - 290px);overflow:auto}
  .dc{display:grid;grid-template-columns:34px 1fr 56px 78px;align-items:center;padding:7px 10px;border-bottom:1px solid #eef1f6;cursor:pointer;font-weight:600;font-size:13px}
  .dc:hover{background:#f4f8ff}
  .dc .n{text-align:center;font-weight:700}
  .dc .name small{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;color:#222}
  .dc input{width:17px;height:17px;cursor:pointer}
  .dc .num{text-align:center}
  .dc.taken{background:#fafbfd}

  /* papan pembagian (2D rata) */
  .board{background:#000;border:1px solid #000;overflow-x:auto}
  .bh,.ln{display:grid;grid-template-columns:150px minmax(220px,1fr) 84px 110px 50px minmax(170px,1.1fr);gap:1px;background:#000;min-width:780px;margin-bottom:2px}
  .bh:last-child,.ln:last-child{margin-bottom:0}
  .bh{font-weight:700;text-align:center}
  .bh>div{background:var(--cyan);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;line-height:1.1}
  .bh .t{grid-column:span 2;font-size:15px}
  .bh .h b{font-size:17px}
  .bh .h small{font-size:10.5px;font-weight:700;color:#0a5566;margin-top:2px}
  .ln{position:relative;cursor:pointer}
  .ln.active{outline:3px solid var(--brand);outline-offset:-3px;z-index:1}
  .ln>div{background:var(--c);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:6px;min-height:42px}
  .ln .lbl{grid-column:1;flex-direction:column;gap:3px;font-size:15px}
  .ln .lbl small{font-size:11px;font-weight:600;color:#333}
  .ln .lbl .tag{font-size:11px;font-weight:700;color:#1f4fb3}
  .ln .lbl .tag.ok{color:#fff;background:#1f9d55;border-radius:3px;padding:1px 7px}
  .ln .dt{grid-column:2;gap:8px;font-size:12.5px;cursor:pointer}
  .ln .dt:hover{text-decoration:underline}
  .ln .dt b.x{cursor:pointer;color:#b00020;font-size:15px;line-height:1}
  .ln .dt i{font-style:normal}
  .ln .num{font-size:16px}
  .ln .c3{grid-column:3}.ln .c4{grid-column:4}.ln .c5{grid-column:5}
  .ln .chk{background:#fff}
  .ln .chk input{width:20px;height:20px;cursor:pointer;accent-color:#1e9e50}
  .ln .note{grid-column:6;background:#fff;padding:4px}
  .ln .note textarea{width:100%;height:100%;min-height:58px;border:0;resize:none;font-weight:400;padding:4px;background:#fff}
  .ln .empty{grid-column:2/span 4;color:#6f7682;font-weight:400;font-style:italic;background:var(--c)}
  /* DC sudah selesai: DC, WO, PCS diblok hijau */
  .ln>div.fin{background:#1f9d55;color:#fff}
  .ln .fin b.x{color:#ffd9d9}
  .ln .dt.fin::before{content:"✔ "}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat small{color:var(--mute);display:block}
  .stat b{font-size:18px}
  .bar{height:10px;background:#dfe5ee;border-radius:6px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%}
  .hint{color:var(--mute);font-size:12px;padding:8px 12px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
  #toast.show{opacity:1}
  #loader{position:fixed;inset:0;background:rgba(255,255,255,.8);backdrop-filter:blur(2px);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-weight:700;z-index:30;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  #loader.show{opacity:1;visibility:visible}
  .spin{width:44px;height:44px;border:4px solid #d9e4fb;border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .skel{height:16px;margin:14px 10px;border-radius:6px;background:linear-gradient(90deg,#eceff5 25%,#f8fafd 50%,#eceff5 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
  .skel.t{height:46px}
  @keyframes shim{to{background-position:-200% 0}}
  .fadein{animation:fin .35s ease both}
  @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* rekap keterangan per DC */
  #rekap{display:none;padding:14px;overflow-x:auto}
  body.v-rekap #rekap{display:block}
  body.v-rekap main,body.v-rekap #btnAuto,body.v-rekap #btnClear,body.v-rekap #btnExport,body.v-rekap #btnSave,body.v-rekap #lineCtl{display:none}
  .rk-wrap{min-width:980px;max-width:1300px;background:#fff;border:2px solid #000}
  .rk-top,.rk-h,.rk-r{display:grid;grid-template-columns:minmax(230px,2fr) 92px 112px minmax(210px,1.6fr) minmax(250px,1.7fr);align-items:stretch}
  .rk-top{padding:10px 0 8px;gap:4px;font-weight:700;text-align:center}
  .rk-top>div{display:flex;align-items:center;justify-content:center}
  .rk-shift{font-size:18px}
  .rk-y{background:var(--yellow);border:2px solid #000;font-size:18px;padding:6px 0}
  .rk-h,.rk-r{gap:1px;background:#000}
  .rk-h{border-top:2px solid #000;border-bottom:2px solid #000}
  .rk-h>div{background:#a4c2f4;display:flex;align-items:center;justify-content:center;padding:7px 4px;font-size:12px;font-weight:700;text-align:center}
  .rk-r{border-bottom:1px solid #000;cursor:pointer;font-weight:700;font-size:13px}
  .rk-r>div{background:#fff;padding:6px 10px;display:flex;align-items:center;min-height:40px}
  .rk-r:hover>.d,.rk-r:hover>.c{background:#eaf2ff}
  .rk-r .d{justify-content:flex-start}
  .rk-r .c{justify-content:center;text-align:center}
  .rk-r .k{justify-content:flex-start;color:#8a929e;font-weight:500}
  .rk-r .k.has{background:hsl(var(--kh) 85% 80%);color:hsl(var(--kh) 80% 12%);font-weight:700}
  .rk-r .pg{flex-direction:column;align-items:stretch;justify-content:center;gap:2px;font-weight:600}
  .pg .pl{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .pg .pl span{width:30px;color:#4b5565}
  .pg .pl b{flex:1;font-size:12.5px}
  .pg .pl em{font-style:normal;font-size:11.5px;color:#1c4f9e}
  .b3{height:9px;background:#dfe5ee;border:1px solid #9aa5b5;margin-bottom:3px}
  .b3 i{display:block;height:100%;background:#2b7be8}
  .b3.g i{background:#2fb465}
  .b3.full i{background:#f5bd0a}
  .rk-note{color:var(--mute);font-size:12px;padding:8px 4px}
  /* progres per Line */
  .ln .lbl .lp{width:100%;height:8px;background:#fff;border:1px solid #000;margin-top:2px}
  .ln .lbl .lp i{display:block;height:100%;background:#1f9d55}
  .lprog{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .lprog .pl{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .lprog .pl span{width:30px;color:#4b5565}
  .lprog .pl b{flex:1;font-size:12.5px}
  .lprog .pl em{font-style:normal;font-size:11.5px;color:#1c4f9e}
  .lprog .eta{font-size:11.5px;color:#444;margin-top:2px;line-height:1.3}
  .lprog .eta.ok{color:#1f8f4a;font-weight:700}

  /* jendela data asli spreadsheet */
  #dlg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
  #dlg.show{display:flex}
  .dlg-box{background:#fff;border-radius:14px;width:min(1180px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .dlg-h{padding:12px 16px;background:linear-gradient(180deg,#f3f7ff,#dfe8f8);border-bottom:1px solid #b9c7e0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .dlg-h h3{margin:0;font-size:15px;flex:1 1 280px}
  .dlg-h h3 small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
  .dlg-h .seg button{padding:6px 12px}
  .dlg-h .seg button.on.ok{background:#1f8f4a;border-color:#1f8f4a}
  .dlg-h .seg button.on.no{background:#c62828;border-color:#c62828}
  .binp{padding:9px 16px;background:#fff8e1;border-bottom:1px solid #f0d98a;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .binp .chip{background:#ffe08a;border:1px solid #d9b23a;border-radius:4px;padding:2px 8px;font-weight:700}
  .binp .chip em{font-style:normal;font-weight:500;color:#555;font-size:11.5px}
  .binp .dobox{width:100%;font:12.5px/1.4 Consolas,monospace;border:1px solid #d9b23a;border-radius:4px;padding:6px;background:#fff;resize:vertical}
  .dlg-b{overflow:auto}
  .dlg-b table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  .dlg-b th{position:sticky;top:0;background:linear-gradient(180deg,#bcd2f7,#9dbbee);padding:8px 10px;text-align:left;font-size:12px;border-bottom:2px solid #6f93d1;white-space:nowrap}
  .dlg-b td{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.12);white-space:nowrap}
  .dlg-b tbody td:not(:first-child){cursor:copy}
  .dlg-b tbody td:not(:first-child):hover{outline:2px solid var(--brand);outline-offset:-2px}
  .dlg-b td.copied{background:#ffe08a!important;color:#000!important}
  .dlg-b th[data-ccol],.dlg-b th[data-copy]{background:linear-gradient(180deg,#d4e3fb,#b3cdf5)}
  .dlg-b tr.ok td{background:#c9f2d3;color:#0b4a1f}
  .dlg-b tr.no td{background:#ffd2d2;color:#7a0b0b}
  .dlg-b tr.ok td:first-child{box-shadow:inset 5px 0 0 #1f8f4a}
  .dlg-b tr.no td:first-child{box-shadow:inset 5px 0 0 #c62828}
  .pill{display:inline-block;padding:1px 9px;border-radius:10px;font-weight:700;font-size:11.5px;color:#fff}
  .pill.ok{background:#1f8f4a}.pill.no{background:#c62828}
  .dlg-f{padding:8px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  @media print{
    header,.panel.left,.hint,.stats,#toast,#loader,#dlg{display:none!important}
    body.v-rekap main{display:none!important} body:not(.v-rekap) #rekap{display:none!important} #rekap{padding:0}
    main{display:block;padding:0} body{background:#fff}
    .ln.active{outline:0;background:none} .ln .x{display:none} .rk-r{transform:none!important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div id="loader" class="show"><div class="spin"></div><div id="loaderMsg">Memuat data…</div></div>

<header>
  <h1>📦 Pembagian Line</h1>
  <div class="seg" id="segV"><button data-v="board" class="on">📋 Pembagian</button><button data-v="rekap">🗒️ Rekap Keterangan</button></div>
  <div class="ctl">Shift
    <select id="shift"><option>1</option><option>2</option><option selected>3</option></select>
  </div>
  <div class="ctl" id="lineCtl">Jumlah Line
    <div class="seg" id="segN"><button data-n="3">3 Line</button><button data-n="4" class="on">4 Line</button><button data-n="5">5 Line</button></div>
  </div>
  <div class="spacer"></div>
  <button id="btnAuto">⚖️ Bagi Otomatis</button>
  <button id="btnClear">🗑️ Reset</button>
  <button id="btnReload">🔄 Muat Ulang Data</button>
  <label class="ctl" title="Muat ulang data otomatis tiap 3 menit (membantu estimasi selesai)"><input type="checkbox" id="autoRef"> Auto 3 mnt</label>
  <button id="btnPrint">🖨️ Cetak</button>
  <button id="btnExport">📄 Ke Sheet</button>
  <button id="btnSave" class="primary">💾 Simpan</button>
</header>

<main>
  <section class="panel left">
    <h2>Data per DC <span id="updInfo" style="font-weight:400;color:var(--mute);font-size:12px"></span></h2>
    <div class="sum">
      <div id="sumShift">SHIFT 3</div><div id="sumWo">0</div><div id="sumPcs">0</div>
    </div>
    <div class="filters">
      <select id="fSrc">
        <option value="all">Gabungan (Data 1 + Data 2)</option>
        <option value="1">Data 1 (blok kiri)</option>
        <option value="2">Data 2 (blok kanan)</option>
      </select>
      <label class="ctl"><input type="checkbox" id="fDone"> Sembunyikan DONE</label>
      <input type="text" id="fSearch" placeholder="Cari DC…">
    </div>
    <div class="lh"><div>✔</div><div>DC</div><div>WO</div><div>TOTAL PCS</div></div>
    <div class="dclist" id="dcList"></div>
    <div class="hint">Klik sebuah <b>Line</b> di kanan untuk mengaktifkannya, lalu <b>ceklis DC</b>. DC yang sudah masuk Line lain akan dipindahkan ke Line aktif.</div>
  </section>

  <section>
    <div class="board" id="board"></div>
    <div class="stats" id="stats"></div>
  </section>
</main>
<section id="rekap"></section>
<div id="toast"></div>
<div id="dlg"></div>

<script>
const COLORS = ['#fff2cc','#b6d7a8','#c9daf8','#ead1dc','#fce5cd'];
const fmt = n => Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const isDone = r => { const v = r && r.done; return v === true || /^(true|ya|yes|1|done|selesai)$/i.test(String(v == null ? '' : v).trim()); };

let RAW = [];
let HEADS = {};            // judul kolom tiap blok dari Master Data
let S = { n:4, active:0, assign:{}, notes:{}, done:{}, doneDc:{} };
let DCS = [];               // hasil agregasi (terfilter)
let saveTimer = null;
const API_URL = 'https://script.google.com/macros/s/AKfycbysvbddcHGhdAkVRVe7KW-fFQpY8h9z32ktBGXaMEM51w1RS_NN6sW8gDaFUwWe0NvM/exec';
const HAS_GAS = !!API_URL;

/* ---------- Pemanggil backend Apps Script lewat fetch ---------- */
async function gas(fn, ...args){
  if (!API_URL) return demo(fn);
  let res;
  if (fn === 'getMasterData' || fn === 'loadState'){
    const u = API_URL + '?action=' + fn + '&shift=' + encodeURIComponent(args[0] || '') + '&t=' + Date.now();
    res = await fetch(u);
  } else {
    const body = fn === 'saveState' ? { action:fn, shift:args[0], state:args[1] } : { action:fn, payload:args[0] };
    res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body) });
  }
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j.data;
}
function demo(fn){
  if (fn !== 'getMasterData') return null;
  const d = [['STOCK-PARAMA RDC BANJARMASIN',61,50935],['STOCK-PARAMA DC SURABAYA',55,15911],['STOCK-PARAMA DC SOLO',37,13616],
    ['FC NGANJUK-PARAMA FC ECOMMERCE NGANJUK',42,9949],['STOCK-PARAMA DC SEMARANG',20,4697],['FC FATMAWATI-PARAMA FC FATMAWATI',49,2325],
    ['PALEM FG-PARAMA HEAD OFFICE',21,968],['FC FATMAWATI-PARAMA FC SRENGSENG',10,472],['STOCK-PARAMA DC SUKABUMI',4,456],['FC BANJARMSN-PARAMA RDC BANJARMASIN',1,20]];
  const rows = [];
  d.forEach(([dc,wo,pcs]) => { for(let i=0;i<wo;i++) rows.push({s:i%5?1:2,dc,wo:dc.slice(0,3)+i,qty:i===wo-1?pcs-Math.floor(pcs/wo)*(wo-1):Math.floor(pcs/wo),done:i%4===0,picker:''}); });
  return {rows, updated:new Date().toISOString()};
}

/* ---------- Agregasi (seperti gambar 1) ---------- */
function aggregate(){
  const src = $('fSrc').value, hideDone = $('fDone').checked, q = $('fSearch').value.trim().toUpperCase();
  const m = new Map();
  RAW.forEach(r => {
    if (src !== 'all' && String(r.s) !== src) return;
    if (hideDone && isDone(r)) return;
    let o = m.get(r.dc);
    if (!o) m.set(r.dc, o = { dc:r.dc, wos:new Set(), pcs:0, srcs:new Set() });
    o.wos.add(r.wo || ('row' + Math.random()));
    o.pcs += r.qty;
    o.srcs.add(r.s);
  });
  DCS = [...m.values()].map(o => ({ dc:o.dc, wo:o.wos.size, pcs:o.pcs, srcs:[...o.srcs] }))
        .sort((a,b) => b.pcs - a.pcs);
  return q ? DCS.filter(d => d.dc.includes(q)) : DCS;
}

/* ---------- Render daftar DC ---------- */
function renderList(){
  const list = aggregate();
  const tWo = DCS.reduce((a,d)=>a+d.wo,0), tPcs = DCS.reduce((a,d)=>a+d.pcs,0);
  $('sumShift').textContent = 'SHIFT ' + $('shift').value;
  $('sumWo').textContent = fmt(tWo); $('sumPcs').textContent = fmt(tPcs);
  $('dcList').innerHTML = list.map(d => {
    const li = S.assign[d.dc];
    const taken = li !== undefined && li < S.n;
    const tag = taken ? `<small style="background:${COLORS[li]}">LINE ${li+1}</small>` : '';
    return `<div class="dc ${taken?'taken':''}" data-dc="${encodeURIComponent(d.dc)}">
      <div class="n"><input type="checkbox" ${taken?'checked':''} tabindex="-1"></div>
      <div class="name">${esc(d.dc)}${tag}</div>
      <div class="num">${d.wo}</div><div class="num">${fmt(d.pcs)}</div></div>`;
  }).join('') || '<div class="hint">Tidak ada data.</div>';
}

/* ---------- Render papan (seperti gambar 4) ---------- */
function lineData(i){
  const items = DCS.filter(d => S.assign[d.dc] === i);
  return { items, wo: items.reduce((a,d)=>a+d.wo,0), pcs: items.reduce((a,d)=>a+d.pcs,0) };
}
/* ---------- Progres per Line & estimasi selesai ---------- */
function progMap(){                       // total & selesai per DC dari spreadsheet (baris DONE = TRUE)
  const src = $('fSrc').value, m = new Map();
  RAW.forEach((r, idx) => {
    if (src !== 'all' && String(r.s) !== src) return;
    let o = m.get(r.dc); if (!o) m.set(r.dc, o = { wm:new Map(), pcs:0, donePcs:0 });

const snapKey = () => 'pl_snap_' + $('shift').value + '_' + new Date().toLocaleDateString('sv-SE');

    const k = snapKey(), a = JSON.parse(localStorage.getItem(k) || '[]'), now = Date.now();
    if (a.length && now - a[a.length-1].t < 30000) return;
    const dc = {}; progMap().forEach((o, n) => { dc[n] = o.donePcs; });

const hhmm = t => new Date(t).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });

function progFor(items, PM){
  const P = { items, wo:0, doneWo:0, pcs:0, donePcs:0 };
  items.forEach(d => {
    const p = PM.get(d.dc) || { wo:0, doneWo:0, pcs:0, donePcs:0 }, chk = !!S.doneDc[d.dc];   // DC diceklis = dianggap selesai semua
    P.wo += p.wo; P.pcs += p.pcs; P.doneWo += chk ? p.wo : p.doneWo; P.donePcs += chk ? p.pcs : p.donePcs;

}
function etaOf(P, PM){
  const remain = P.pcs - P.donePcs;

  let a = []; try { a = JSON.parse(localStorage.getItem(snapKey()) || '[]'); } catch(e){}
  const now = Date.now(), base = a.find(x => now - x.t <= 90*60000);
  if (!base) return { txt:'ETA: menunggu data, muat ulang beberapa menit lagi' };
  const mins = (now - base.t) / 60000;
  if (mins < 5) return { txt:'ETA: butuh data ≥ 5 menit (sejak ' + hhmm(base.t) + ')' };
  let delta = 0;
  P.items.forEach(d => { const p = PM.get(d.dc); if (!p) return; const b = base.dc[d.dc]; delta += Math.max(0, p.donePcs - (b === undefined ? p.donePcs : b)); });
  if (delta <= 0) return { txt:'ETA: belum ada pcs selesai sejak ' + hhmm(base.t) };
  const rate = delta / mins, left = remain / rate;
  return { txt:'ETA ' + hhmm(now + left*60000) + ' · ±' + fmtDur(left) + ' lagi · ' + fmt(rate*60) + ' pcs/jam' };
}
function progCard(P, PM){

  return `<div class="lprog"><div class="pl"><span>PCS</span><b>${fmt(P.donePcs)}/${fmt(P.pcs)}</b><em>${pp}%</em></div>${bar(pp, true)}
    <div class="pl"><span>WO</span><b>${P.doneWo}/${P.wo}</b><em>${pw}%</em></div>${bar(pw, false)}<div class="eta ${e.ok?'ok':''}">${e.txt}</div></div>`;
}

const ketOf = r => {
  let k = (r.ket !== undefined ? r.ket : r.keterangan);
  if (Array.isArray(k)) k = k.map(x => String(x == null ? '' : x).trim()).filter(Boolean).join('\n');
  return String(k == null ? '' : k).trim();
};
let REK = [];
function aggRekap(){
  const src = $('fSrc').value, q = $('fSearch').value.trim().toUpperCase();
  const m = new Map();
  RAW.forEach((r, idx) => {
    if (src !== 'all' && String(r.s) !== src) return;
    if (q && !String(r.dc).toUpperCase().includes(q)) return;
    const ket = ketOf(r), key = r.dc + '\u0001' + ket;
    let o = m.get(key);
    if (!o) m.set(key, o = { dc:r.dc, ket, wm:new Map(), pcs:0, donePcs:0 });
    const qty = +r.qty || 0, d = isDone(r), wk = r.wo || ('row' + idx);
    o.wm.set(wk, (o.wm.has(wk) ? o.wm.get(wk) : true) && d);   // WO selesai bila semua barisnya TRUE

  });

}
$('dcList').addEventListener('click', e => {
  const row = e.target.closest('.dc'); if (!row) return;
  toggleDC(decodeURIComponent(row.dataset.dc));
});
$('board').addEventListener('click', e => {
  if (e.target.dataset.rm){ delete S.assign[decodeURIComponent(e.target.dataset.rm)]; render(); queueSave(); return; }
  if (e.target.dataset.dd !== undefined){ S.doneDc[decodeURIComponent(e.target.dataset.dd)] = e.target.checked; renderBoard(); queueSave(); return; }
  if (e.target.matches('textarea')) return;
  const dt = e.target.closest('.dt'); if (dt){ openDc(decodeURIComponent(dt.dataset.dc)); return; }
  const ln = e.target.closest('.ln'); if (!ln) return;
  S.active = +ln.dataset.line; renderBoard();
});
$('board').addEventListener('input', e => {
  if (e.target.dataset.note !== undefined){ S.notes[e.target.dataset.note] = e.target.value; queueSave(); }
});
$('segN').addEventListener('click', e => {
  const n = +e.target.dataset.n; if (!n) return;
  S.n = n; if (S.active >= n) S.active = 0;
  Object.keys(S.assign).forEach(k => { if (S.assign[k] >= n) delete S.assign[k]; });
  markSeg(); render(); queueSave();
});
function markSeg(){ [...$('segN').children].forEach(b => b.classList.toggle('on', +b.dataset.n === S.n)); }

['fSrc','fDone'].forEach(id => $(id).addEventListener('change', render));
$('fSearch').addEventListener('input', () => { renderList(); renderRekap(); });
let prevShift = '3';
$('shift').addEventListener('change', async () => {
  clearTimeout(saveTimer);
  await saveNow(false, prevShift);            // simpan dulu pembagian shift sebelumnya
  prevShift = $('shift').value;
  await loadData(false);                       // ambil data shift terpilih langsung dari spreadsheet
  await loadShift();
});

$('btnAuto').onclick = () => {
  if (Object.keys(S.assign).length && !confirm('Pembagian saat ini akan diganti dengan pembagian otomatis (seimbang berdasarkan pcs). Lanjut?')) return;
  S.assign = {}; const tot = Array(S.n).fill(0);
  DCS.forEach(d => { const i = tot.indexOf(Math.min(...tot)); S.assign[d.dc] = i; tot[i] += d.pcs; });
  render(); queueSave(); toast('Dibagi otomatis ke ' + S.n + ' Line');
};
$('btnClear').onclick = () => { if (confirm('Kosongkan semua pembagian?')) { S.assign = {}; S.notes = {}; S.done = {}; S.doneDc = {}; render(); queueSave(); } };
$('btnReload').onclick = () => loadData(true);
$('btnPrint').onclick = () => window.print();
$('btnSave').onclick = async () => { const b = $('btnSave'); b.disabled = true; b.textContent = '⏳ Menyimpan…'; await saveNow(true); b.disabled = false; b.textContent = '💾 Simpan'; };
$('btnExport').onclick = async () => {
  const lines = Array.from({length:S.n}, (_,i) => ({
    name:'LINE ' + (i+1), color:COLORS[i], note:S.notes[i] || '',
    dcs: lineData(i).items.map(d => ({dc:d.dc, wo:d.wo, pcs:d.pcs}))
  }));
  try {
    showLoader('Menulis ke sheet…');
    const url = await gas('exportToSheet', { shift:$('shift').value, lines });
    toast('Berhasil ditulis ke sheet "Hasil Pembagian"');
    if (url && HAS_GAS) window.open(url, '_blank');
  } catch (err) { toast('Gagal: ' + (err.message || err)); } finally { hideLoader(); }
};

/* ---------- Simpan / muat ---------- */
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(false), 1500); }
async function saveNow(show, keyOverride){
  const key = keyOverride || $('shift').value;
  try { if (HAS_GAS) await gas('saveState', key, S); else localStorage.setItem('pl_' + key, JSON.stringify(S)); if (show) toast('Tersimpan'); }
  catch (e) { if (show) toast('Gagal menyimpan'); }
}
async function loadShift(){
  let st = null;
  try { st = HAS_GAS ? await gas('loadState', $('shift').value) : JSON.parse(localStorage.getItem('pl_' + $('shift').value) || 'null'); } catch(e){}
  S = Object.assign({ n:4, active:0, assign:{}, notes:{}, done:{}, doneDc:{} }, st || {}); if (!S.doneDc) S.doneDc = {};
  markSeg(); render();
}
async function loadData(show, silent){
  if (silent && document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;   // jangan ganggu saat mengetik catatan
  if (!silent){ showLoader('Memuat data Shift ' + $('shift').value + '…'); showSkeleton(); }
  const sc = $('dcList').scrollTop;
  try {
    const r = await gas('getMasterData', $('shift').value);
    RAW = r.rows; HEADS = r.heads || {};
    $('updInfo').textContent = 'Update ' + new Date(r.updated).toLocaleTimeString('id-ID');
    if (show) toast('Data dimuat: ' + RAW.length + ' baris');
    recordSnap();
  } catch (e) { if (!silent) toast('Gagal memuat data: ' + (e.message || e)); }
  render();
  if (silent) $('dcList').scrollTop = sc; else { hideLoader(); pop('dcList','board','stats','rekap'); }
}
let autoT = null;
$('autoRef').addEventListener('change', e => {
  clearInterval(autoT);
  if (e.target.checked){ autoT = setInterval(() => { if (!document.hidden) loadData(false, true); }, 180000); toast('Data dimuat ulang otomatis tiap 3 menit'); }
});
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

(async () => { await loadData(false); await loadShift(); })();
</script>
</body>
</html>
